name: Android CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: tools platform-tools

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125"

      - name: Build hev-socks5-tunnel (native libraries)
        shell: bash
        run: |
          set -euo pipefail
          NDK_PATH="/usr/local/lib/android/sdk/ndk/26.1.10909125"
          JNI_DIR="${GITHUB_WORKSPACE}/app/src/main/jni"
          
          # Clone hev-socks5-tunnel if not present
          if [ ! -d "${JNI_DIR}/hev-socks5-tunnel" ]; then
            git clone --depth 1 https://github.com/heiher/hev-socks5-tunnel.git "${JNI_DIR}/hev-socks5-tunnel"
          fi
          
          cd "${JNI_DIR}/hev-socks5-tunnel"
          
          # Build for all ABIs
          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            echo "Building for ${ABI}..."
            make clean
            make \
              CC="${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" \
              AR="${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" \
              STRIP="${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
              CFLAGS="-O2 -fPIC" \
              LDFLAGS="-shared" \
              ABI="${ABI}"
            
            # Copy built .a files to prebuilt/${ABI}/
            mkdir -p "${JNI_DIR}/prebuilt/${ABI}"
            cp bin/libhev-socks5-tunnel.a "${JNI_DIR}/prebuilt/${ABI}/"
            cp bin/libhev-task-system.a "${JNI_DIR}/prebuilt/${ABI}/"
            cp bin/liblwip.a "${JNI_DIR}/prebuilt/${ABI}/"
            cp bin/libyaml.a "${JNI_DIR}/prebuilt/${ABI}/"
            echo "✅ ${ABI}: copied 4 static libraries"
          done

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
