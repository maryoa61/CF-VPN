name: Android CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:
    inputs:
      xray_source:
        description: 'Xray AAR source'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - XTLS/libXray
          - 2dust/AndroidLibXrayLite

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test CFVPN
    runs-on: ubuntu-latest

    env:
      NDK_VERSION: '26.1.10909125'

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'
        cache: 'gradle'

    # ── Xray AAR ──────────────────────────────────────────────
    - name: Download Xray AAR
      run: |
        set -e
        mkdir -p app/libs

        XRAY_SOURCE="${{ github.event.inputs.xray_source || 'auto' }}"
        echo "Xray AAR source preference: $XRAY_SOURCE"

        SUCCESS=false

        if [ "$XRAY_SOURCE" = "XTLS/libXray" ] || [ "$XRAY_SOURCE" = "auto" ]; then
          echo "🔄 Trying XTLS/libXray (zip + extract) ..."
          TMP_ZIP=$(mktemp)
          if curl -sL --fail --retry 3 --retry-delay 5 \
               -o "$TMP_ZIP" \
               "https://github.com/XTLS/libXray/releases/latest/download/libxray-android.zip"; then
            if unzip -o -j "$TMP_ZIP" "*/libXray.aar" -d app/libs/ 2>/dev/null || \
               unzip -o -j "$TMP_ZIP" "libXray.aar" -d app/libs/ 2>/dev/null; then
              fsize=$(stat -c%s app/libs/libXray.aar 2>/dev/null || echo 0)
              if [ "$fsize" -gt 10000000 ]; then
                mv app/libs/libXray.aar app/libs/libv2ray.aar
                echo "✅ XTLS/libXray ($(du -h app/libs/libv2ray.aar | cut -f1))"
                SUCCESS=true
              fi
            fi
            rm -f "$TMP_ZIP"
          fi
        fi

        if [ "$SUCCESS" = "false" ] && \
           { [ "$XRAY_SOURCE" = "2dust/AndroidLibXrayLite" ] || [ "$XRAY_SOURCE" = "auto" ]; }; then
          echo "🔄 Trying 2dust/AndroidLibXrayLite ..."
          if curl -sL --fail --retry 3 --retry-delay 5 \
               -o app/libs/libv2ray.aar \
               "https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar"; then
            fsize=$(stat -c%s app/libs/libv2ray.aar 2>/dev/null || echo 0)
            if [ "$fsize" -gt 10000000 ]; then
              echo "✅ 2dust/AndroidLibXrayLite ($(du -h app/libs/libv2ray.aar | cut -f1))"
              SUCCESS=true
            fi
          fi
        fi

        if [ "$SUCCESS" = "false" ]; then
          echo "::error::Failed to download Xray AAR from ALL sources."
          exit 1
        fi

    # ── hev-socks5-tunnel ─────────────────────────────────────
    - name: Clone hev-socks5-tunnel
      run: |
        git clone --recursive https://github.com/heiher/hev-socks5-tunnel \
          app/src/main/jni/hev-socks5-tunnel

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          "ndk;${{ env.NDK_VERSION }}" 2>&1 | tail -3

    - name: Build static libs for all ABIs
      run: |
        set -e
        NDK_DIR="$ANDROID_HOME/ndk/$NDK_VERSION"
        TC="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"
        SRC="$(pwd)/app/src/main/jni/hev-socks5-tunnel"
        API=24

        declare -A TRIPLES=(
          [arm64-v8a]=aarch64-linux-android
          [armeabi-v7a]=armv7a-linux-androideabi
          [x86]=i686-linux-android
          [x86_64]=x86_64-linux-android
        )

        for ABI in "${!TRIPLES[@]}"; do
          TRIPLE="${TRIPLES[$ABI]}"
          echo "━━━ $ABI ($TRIPLE) ━━━"

          # Clean
          make -C "$SRC" clean || true
          rm -rf "$SRC/bin"

          # Build ALL static libraries with -fPIC
          make -C "$SRC" static -j"$(nproc)" \
            CC="$TC/${TRIPLE}${API}-clang" \
            AR="$TC/llvm-ar" \
            CFLAGS="-DFD_SET_DEFINED -DSOCKLEN_T_DEFINED -DENABLE_LIBRARY -Wno-error=unused-result -fPIC"

          # Merge ALL .a files into one using a temp directory
          OUT="$(pwd)/app/src/main/jni/prebuilt/$ABI"
          mkdir -p "$OUT"
          MERGED="$OUT/libhev-socks5-tunnel.a"
          WORK="$(mktemp -d)"

          # Extract all .o from all .a files (use absolute paths!)
          for lib in "$SRC"/bin/*.a; do
            [ -f "$lib" ] && "$TC/llvm-ar" x "$lib"
            cp -r "$SRC"/bin/*.o "$WORK/" 2>/dev/null || true
          done
          # Also try extracting with cd
          cd "$WORK"
          for lib in "$SRC"/bin/*.a; do
            [ -f "$lib" ] && "$TC/llvm-ar" x "$lib"
          done

          # Find ALL .o files and create merged .a
          OFILES=$(find "$WORK" -name '*.o' 2>/dev/null)
          if [ -n "$OFILES" ]; then
            echo "$OFILES" | xargs "$TC/llvm-ar" rcs "$MERGED"
          else
            echo "::error::No .o files found after extraction!"
            echo "Contents of $SRC/bin/:"
            ls -la "$SRC"/bin/ 2>/dev/null || true
            echo "Contents of $WORK:"
            ls -laR "$WORK" 2>/dev/null || true
            exit 1
          fi

          cd - > /dev/null
          rm -rf "$WORK"

          # Verify
          SIZE=$(du -h "$MERGED" | cut -f1)
          NM_OUT=$("$TC/llvm-nm" "$MERGED" 2>/dev/null | head -5 || true)
          echo "✅ $ABI: merged lib ($SIZE)"
          echo "$NM_OUT" | head -3
        done

    - name: Decode Debug Keystore
      run: echo "${{ secrets.DEBUG_KEY_BASE64 }}" | base64 -d > app/debug.keystore

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    # ── Tests ──────────────────────────────────────────────────
    - name: Run Unit & Robolectric Tests
      run: |
        ./gradlew testDebugUnitTest \
          --no-configuration-cache \
          --stacktrace \
          --no-daemon

    # ── Build ──────────────────────────────────────────────────
    - name: Build Release APK
      run: |
        ./gradlew assembleRelease \
          --no-configuration-cache \
          --stacktrace \
          --no-daemon \
          -Pandroid.injected.signing.store.file=${{ github.workspace }}/app/debug.keystore \
          -Pandroid.injected.signing.store.password=${{ secrets.DEBUG_STORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=${{ secrets.DEBUG_KEY_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ secrets.DEBUG_KEY_PASSWORD }}

    - name: Verify APK and native libs
      run: |
        set -e
        APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
        echo "APK: $APK ($(du -h "$APK" | cut -f1))"

        # Check native libraries inside APK
        echo "Native libs in APK:"
        unzip -l "$APK" | grep '\.so$'

        # Verify hev2socks_bridge.so exists for all ABIs
        for abi in arm64-v8a armeabi-v7a x86 x86_64; do
          if unzip -l "$APK" | grep -q "$abi/libhev2socks_bridge.so"; then
            echo "✅ $abi/libhev2socks_bridge.so present"
          else
            echo "::warning::Missing $abi/libhev2socks_bridge.so in APK"
          fi
        done

        # Also verify libv2ray.so (from Xray AAR)
        for abi in arm64-v8a armeabi-v7a x86 x86_64; do
          if unzip -l "$APK" | grep -q "$abi/libv2ray.so"; then
            echo "✅ $abi/libv2ray.so present"
          else
            echo "::warning::Missing $abi/libv2ray.so in APK"
          fi
        done

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CF-VPN-release
        path: app/build/outputs/apk/**/*.apk
        retention-days: 15

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: app/build/reports/tests/
        retention-days: 5
